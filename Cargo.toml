[package]
name = "quire-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Orchestrating driver: calls QSL (compile, emit, route) and CG (negotiate) across repositories (ADR-011 T-13)."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-driver"
publish = false

[lib]
name = "quire_driver"
path = "src/lib.rs"

# ADR-011 §6.1 driver row: the driver depends on the QSL layer crates, on CG
# and on IR's model crate (the E5 v2 reader and `CheckedNodeId`), and nothing
# depends on it. It is downstream of CG because CG -> QSL
# (`qsl-replay`) is a normal edge and Cargo refuses a package cycle.
#
# Revisions (informational, not a gate): the QSL layer crates are pinned at
# daa0178 (unchanged; QSL-255b PR 2 moves this next), and CG at 8fb0630 on
# agent-ix/quire-contract-codegen main (the squash-merge of #177, IR-297),
# which pins `quire-contract-ir` at 48ab5dc (IR-296). The driver's direct
# `quire-contract-model` is set to the same 48ab5dc, so it is the same
# package as CG's IR dependency: `tests/dependency_edges.rs` checks this by
# identity, not just by revision string.
# QSL's layer crates still bring a second `quire-contract-model` copy
# (b52c263) transitively via `qsl-replay`, at the QSL revision above. A third
# copy (7b1ec7a) arrives because `quire-contract-ir` at 48ab5dc itself depends
# on the QSL root crate `quire-spec-language` at a revision QSL has not
# reached yet, which pins its own `quire-contract-model`. Both are
# informational, not a gate: no IR type crosses between the driver's model
# copy and either of the others at compile time (they are different Rust
# types even with the same name), so this either compiles or it doesn't. They
# converge to one copy when QSL bumps its own `quire-contract-model` pin
# (QSL-255b PR 2).
[dependencies]
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", rev = "daa0178b0ab82b6e1dc4a7868044d2596ec51374" }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", rev = "8fb0630a715125a19703f286267db1611dfbe05f" }
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", rev = "48ab5dc29213c3975a5fe8f04ecbb3d1c2b345bb" }
# E5: the diagnostics catalog reference is read back from the emitted wire,
# because QSL exports no accessor for it (QSL-260). This dependency goes when
# it does (FR-001 Status).
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
# The Kani claim map a test hands the driver names an RT integer domain.
quire-contract-runtime = { git = "https://github.com/agent-ix/quire-contract-runtime", rev = "c52442a56a879cb5ce02a63bcbe430b85bf74a6d", features = ["exact"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
