[package]
name = "quire-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Orchestrating driver: calls QSL (compile, emit, route) and CG (negotiate) across repositories (ADR-011 T-13)."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-driver"
publish = false

[lib]
name = "quire_driver"
path = "src/lib.rs"

# ADR-011 §6.1 driver row: the driver depends on the QSL layer crates, on CG
# and on IR's model crate (the E5 v2 reader and `CheckedNodeId`), and nothing
# depends on it. It is downstream of CG because CG -> QSL
# (`qsl-replay`) is a normal edge and Cargo refuses a package cycle.
#
# Revisions (informational, not a gate): the QSL layer crates are pinned at
# a553b7c1 on agent-ix/quire-spec-language main (#452-#455: QSL's own
# `quire-contract-model` pin moves to 48ab5dc, plus the diagnostics-catalog
# accessor and the per-item requirements accessor), and CG at edade59 on
# agent-ix/quire-contract-codegen main (#182, IR-302: reads QSL's own literal
# references and narrowing-conversion result bounds, fixing the `x + 1` and
# `x + y` regression #179's IR-298 introduced -- see FR-001's Behavior and
# TC-006 for the shapes CG now supports and its two remaining limits). CG's
# #182 still pins `quire-contract-ir` at 48ab5dc and `qsl-replay` at
# `daa0178`, unchanged from #178 and #180. The driver's direct
# `quire-contract-model` stays at the same 48ab5dc, and QSL's own pin
# (reached through this crate's QSL layer-crate pins, via `qsl-package`) now
# shares it too: `tests/dependency_edges.rs` checks this by identity, not
# just by revision string.
#
# Two more copies remain, both outside this crate's own pins:
#
# - `b52c263` stays, reached through CG's own `qsl-replay` pin, which is
#   still `daa0178` (CG has not bumped it to match this crate's QSL
#   revision). No code in CG's own `src/` calls that dependency yet (CG's
#   own Cargo.toml says so); it exists only for CG's own build-order
#   reasons (IR-254). Moving it is CG's own pin to move, not this crate's.
# - `7b1ec7a` stays because `quire-contract-ir` at 48ab5dc itself depends
#   on the QSL root crate `quire-spec-language` at 9395be4 (IR's own edge,
#   not this crate's QSL pin), which pins its own `quire-contract-model`.
#   It stays until IR's root crate drops its QSL edge
#   (agent-ix/quire-contract-ir#141).
#
# Both are informational, not a gate: no IR type crosses between either of
# them and the shared 48ab5dc copy at compile time (they are different Rust
# types even with the same name), so this either compiles or it doesn't.
#
# E4 (emit, via QSL's own `qsl-package`) and E5 (`src/handoff.rs`, read, via
# this crate's own `quire-contract-model` pin) now run under the same model
# revision (48ab5dc), so the version skew the previous revision comment
# described (E4 under b52c263, E5 under 48ab5dc) is resolved.
[dependencies]
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", rev = "a553b7c1b89f953cd4a5350f51cdef37487da808" }
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", rev = "a553b7c1b89f953cd4a5350f51cdef37487da808" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", rev = "a553b7c1b89f953cd4a5350f51cdef37487da808" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", rev = "a553b7c1b89f953cd4a5350f51cdef37487da808" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", rev = "a553b7c1b89f953cd4a5350f51cdef37487da808" }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", rev = "edade5935d96d5fd616a7a4d9f47a2dc15be03f3" }
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", rev = "48ab5dc29213c3975a5fe8f04ecbb3d1c2b345bb" }
thiserror = "=2.0.20"

[dev-dependencies]
# `serde_json` is no longer needed to read the diagnostics catalog back off
# the emitted wire (QSL-260 is closed by #453; see src/handoff.rs), so it is
# no longer a normal dependency. This crate's own tests still use it: to
# assert wire shapes (settlement dispositions, the derived claim map), and
# `tests/dependency_edges.rs` to parse `cargo metadata`'s JSON.
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
