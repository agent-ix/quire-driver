[package]
name = "quire-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "Orchestrating driver: calls QSL (compile, emit, route) and CG (negotiate) across repositories (ADR-011 T-13)."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-driver"
publish = false

[workspace]
members = ["quire-cache", "quire-cli", "quire-plugin-host"]
default-members = [".", "quire-cache", "quire-cli", "quire-plugin-host"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

[lib]
name = "quire_driver"
path = "src/lib.rs"

# ADR-011 §6.1 driver row: the driver depends on the QSL layer crates, on CG
# and on IR's model crate (the E5 v2 reader and `CheckedNodeId`), and no QSL,
# IR or CG package depends on it. Downstream packages such as `quire-cache`
# may depend on its interface. It is downstream of CG because CG -> QSL
# (`qsl-replay`) is a normal edge and Cargo refuses a package cycle.
#
# The QSL layer crates and CG are tracked on `main` of their repositories, the
# same spelling CG and QSL use for their own `quire-contract-model` edge, so
# the graph resolves one copy of it. The exact commits are in Cargo.lock.
[dependencies]
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", branch = "main" }
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
# QSpec FR-331's linked manifest snapshot is canonicalized at registry admission.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main" }
# QSL's caller-owned cancellation handle is a public driver API type.
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
quire-semantic-value = { git = "https://github.com/agent-ix/quire-semantic-value", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints]
workspace = true
