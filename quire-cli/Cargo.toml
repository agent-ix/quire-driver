[package]
name = "quire-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing quire command-line application."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-driver"
publish = false

[[bin]]
name = "quire"
path = "src/main.rs"

[features]
# Opt-in TC-018 seam; it is absent from default features and only active in
# builds with debug assertions. Other builds reject explicit feature selection.
tc018-test-adapter = []

[dependencies]
quire-semantic-value = { git = "https://github.com/agent-ix/quire-semantic-value", branch = "main" }
base64 = "=0.22.1"
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-cst = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
quire-cache = { path = "../quire-cache" }
quire-driver = { path = ".." }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", features = ["serde_json"] }
quire-plugin-host = { path = "../quire-plugin-host" }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
serde_path_to_error = "=0.1.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.3.18"

[dev-dependencies]
libc = "=0.2.190"
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", branch = "main" }
quire-contract-model = { git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
regex = "=1.13.1"

[lints]
workspace = true
