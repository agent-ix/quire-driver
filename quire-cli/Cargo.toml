[package]
name = "quire-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "The user-facing quire command-line application."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-driver"
publish = false

[[bin]]
name = "quire"
path = "src/main.rs"

[features]
# Enables TC-018's test-only exit-function seam. The code itself is excluded
# from release builds, even when this feature is accidentally selected.
tc018-test-adapter = []

[dependencies]
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
# IR-609 composes the user-facing CLI with its separately bounded cache.
quire-cache = { path = "../quire-cache" }
quire-driver = { path = ".." }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
quire-plugin-host = { path = "../quire-plugin-host" }
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.20"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
signal-hook = "=0.3.18"

[dev-dependencies]
regex = "=1.13.1"
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
